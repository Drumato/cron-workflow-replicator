name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          tools/*/go.sum

    - name: Verify dependencies
      run: go mod verify

    - name: Run tests
      run: go test -race -v ./...

    - name: Build binary
      run: make build

    - name: Run examples
      run: make test-examples

    - name: golangci-lint
      run: make lint

    - name: govulncheck
      run: make vuln

    - name: actionlint
      run: make actionlint

name: Build and Push Container Image

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/drumato/cron-workflow-replicator

jobs:
  docker:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          platform: linux/amd64
          suffix: ""
        - os: ubuntu-24.04-arm
          platform: linux/arm64
          suffix: "-arm"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        run: docker buildx create --use --driver docker-container

      - name: Login to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push
        id: build
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ github.ref_name }}${{ matrix.suffix }}
        run: |
          docker buildx build . \
            --platform "$PLATFORM" \
            --tag "$IMAGE:$TAG" \
            --provenance=mode=max \
            --sbom=true \
            --push \
            --metadata-file metadata.json
          echo "digest=$(jq -r '."containerimage.digest"' metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Logout from ghcr.io
        if: always()
        run: docker logout ghcr.io

version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - unconvert
  settings:
    gosec:
      excludes:
        # This CLI reads and writes files at paths the user supplies on purpose.
        - G304
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests read and write fixtures in temporary directories.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
